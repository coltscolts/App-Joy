openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /destinations:
    get:
      operationId: getDestinationSuggestions
      summary: Search the local world city catalog
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 6
      responses:
        "200":
          description: Matching city suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DestinationSuggestion"

  /trips:
    get:
      operationId: getTrips
      summary: List all trips
      responses:
        "200":
          description: List of trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trip"
    post:
      operationId: createTrip
      summary: Create a new trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripInput"
      responses:
        "201":
          description: Created trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"

  /trips/{id}:
    get:
      operationId: getTrip
      summary: Get a trip by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Trip found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "404":
          description: Trip not found
    patch:
      operationId: updateTrip
      summary: Update a trip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripUpdate"
      responses:
        "200":
          description: Updated trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
    delete:
      operationId: deleteTrip
      summary: Delete a trip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /trips/{id}/activities:
    get:
      operationId: getTripActivities
      summary: List activities for a trip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"

  /trips/{id}/transit-recommendations:
    get:
      operationId: getTransitRecommendations
      summary: Get transport alternatives between consecutive trip stops
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum: [en, es]
            default: en
      responses:
        "200":
          description: Transport recommendations for each transition
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransitRecommendation"
        "404":
          description: Trip not found

  /activities:
    post:
      operationId: createActivity
      summary: Create a new activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "201":
          description: Created activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"

  /hotel-stays:
    post:
      operationId: createHotelStays
      summary: Create one or two continuous hotel stays
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HotelStayBatchInput"
      responses:
        "201":
          description: Created hotel stays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"

  /hotel-suggestions:
    get:
      operationId: getHotelSuggestions
      summary: Search hotel names and addresses using Google Places
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: city
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum: [en, es]
            default: en
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 8
            default: 6
      responses:
        "200":
          description: Matching hotels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HotelSuggestion"
        "503":
          description: Google Places is not configured

  /activities/{id}:
    patch:
      operationId: updateActivity
      summary: Update an activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityUpdate"
      responses:
        "200":
          description: Updated activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
    delete:
      operationId: deleteActivity
      summary: Delete an activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /suggestions:
    post:
      operationId: getSuggestions
      summary: Get AI travel suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestionParams"
      responses:
        "200":
          description: List of suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivitySuggestion"

  /bookings/extract:
    post:
      operationId: extractBookings
      summary: Extract flight, hotel or reservation details from a screenshot using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingExtractionRequest"
      responses:
        "200":
          description: Bookings detected in the image (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingExtractionResult"

  /flight-lookup:
    get:
      operationId: flightLookup
      summary: Look up flight details
      parameters:
        - name: flightNumber
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: false
          schema:
            type: string
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum: [en, es]
            default: en
      responses:
        "200":
          description: Flight details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightDetails"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string

    DestinationSuggestion:
      type: object
      required: [city, country, label]
      properties:
        city:
          type: string
        country:
          type: string
        label:
          type: string

    Trip:
      type: object
      required: [id, name, tripType, destination, startDate, endDate, adults, children, stops, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        tripType:
          type: string
          enum: [single, multi]
        destination:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        adults:
          type: number
        children:
          type: number
        coverImage:
          type: ["string", "null"]
        stops:
          type: array
          items:
            $ref: "#/components/schemas/TripStop"
        createdAt:
          type: string

    TripInput:
      type: object
      required: [name, tripType, destination, startDate, endDate, stops]
      properties:
        name:
          type: string
        tripType:
          type: string
          enum: [single, multi]
        destination:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        adults:
          type: number
        children:
          type: number
        coverImage:
          type: ["string", "null"]
        stops:
          type: array
          items:
            $ref: "#/components/schemas/TripStop"

    TripUpdate:
      type: object
      properties:
        name:
          type: string
        tripType:
          type: string
          enum: [single, multi]
        destination:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        adults:
          type: number
        children:
          type: number
        coverImage:
          type: ["string", "null"]
        stops:
          type: array
          items:
            $ref: "#/components/schemas/TripStop"

    TripStop:
      type: object
      required: [destination, startDate, endDate]
      properties:
        destination:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    Activity:
      type: object
      required: [id, tripId, day, date, endDate, type, category, title, placeId, createdAt]
      properties:
        id:
          type: number
        tripId:
          type: number
        day:
          type: string
        date:
          type: string
          format: date
        endDate:
          type: ["string", "null"]
          format: date
        type:
          type: string
        category:
          type: string
        title:
          type: string
        time:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        placeId:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        distance:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        kidFriendly:
          type: ["boolean", "null"]
        budget:
          type: ["string", "null"]
        confirmationNumber:
          type: ["string", "null"]
        flightNumber:
          type: ["string", "null"]
        details:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        reminderEnabled:
          type: ["boolean", "null"]
        createdAt:
          type: string

    ActivityInput:
      type: object
      required: [tripId, day, date, type, category, title]
      properties:
        tripId:
          type: number
        day:
          type: string
        date:
          type: string
          format: date
        endDate:
          type: ["string", "null"]
          format: date
        type:
          type: string
        category:
          type: string
        title:
          type: string
        time:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        placeId:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        distance:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        kidFriendly:
          type: ["boolean", "null"]
        budget:
          type: ["string", "null"]
        confirmationNumber:
          type: ["string", "null"]
        flightNumber:
          type: ["string", "null"]
        details:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        reminderEnabled:
          type: ["boolean", "null"]

    ActivityUpdate:
      type: object
      properties:
        tripId:
          type: number
        day:
          type: string
        date:
          type: string
          format: date
        endDate:
          type: ["string", "null"]
          format: date
        type:
          type: string
        category:
          type: string
        title:
          type: string
        time:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        placeId:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        distance:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        kidFriendly:
          type: ["boolean", "null"]
        budget:
          type: ["string", "null"]
        confirmationNumber:
          type: ["string", "null"]
        flightNumber:
          type: ["string", "null"]
        details:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        reminderEnabled:
          type: ["boolean", "null"]

    HotelStayBatchInput:
      type: object
      required: [stays]
      properties:
        stays:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/ActivityInput"

    HotelSuggestion:
      type: object
      required: [placeId, name, address, city]
      properties:
        placeId:
          type: string
        name:
          type: string
        address:
          type: string
        city:
          type: string

    SuggestionParams:
      type: object
      required: [destination, adults, children, category, date, language]
      properties:
        destination:
          type: string
          minLength: 2
        adults:
          type: number
          minimum: 1
        children:
          type: number
          minimum: 0
        category:
          type: string
          minLength: 1
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        language:
          type: string
          enum: [en, es]
        childAges:
          type: array
          items:
            type: number
        budget:
          type: string
          enum: [low, medium, high]
        interests:
          type: array
          items:
            type: string

    BookingExtractionRequest:
      type: object
      required: [imageBase64, mimeType, language]
      properties:
        imageBase64:
          type: string
          description: Image bytes encoded as base64 (no data URL prefix). Max ~5 MB.
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        language:
          type: string
          enum: [en, es]
        tripId:
          type: number
          description: Trip the booking belongs to; used to resolve years and cities.
    ExtractedBooking:
      type: object
      required: [kind, title]
      properties:
        kind:
          type: string
          enum: [flight, hotel, train, restaurant, tour, transfer, transportation, general]
        title:
          type: string
        date:
          type: string
          nullable: true
          description: Start date (YYYY-MM-DD). Check-in for hotels, departure for flights.
        endDate:
          type: string
          nullable: true
          description: End date (YYYY-MM-DD). Check-out for hotels.
        time:
          type: string
          nullable: true
          description: Local start time (HH:MM, 24h).
        location:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        flightNumber:
          type: string
          nullable: true
        confirmationNumber:
          type: string
          nullable: true
        details:
          type: string
          nullable: true
    BookingExtractionResult:
      type: object
      required: [bookings]
      properties:
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/ExtractedBooking"
    ActivitySuggestion:
      type: object
      required: [title, category, description, location, estimatedTime, kidFriendly, budget]
      properties:
        title:
          type: string
        category:
          type: string
        description:
          type: string
        location:
          type: string
        estimatedTime:
          type: string
        kidFriendly:
          type: boolean
        budget:
          type: string

    FlightDetails:
      type: object
      properties:
        airline:
          type: string
        flightNumber:
          type: string
        departure:
          type: object
          properties:
            airport:
              type: string
            iata:
              type: string
            terminal:
              type: string
            gate:
              type: string
            scheduled:
              type: string
            estimated:
              type: string
        arrival:
          type: object
          properties:
            airport:
              type: string
            iata:
              type: string
            terminal:
              type: string
            gate:
              type: string
            scheduled:
              type: string
            estimated:
              type: string
        status:
          type: string

    TransitRecommendation:
      type: object
      required: [id, origin, destination, travelDate, recommendation, recommendationReason, options]
      properties:
        id:
          type: string
        origin:
          type: string
        destination:
          type: string
        travelDate:
          type: string
          format: date
        recommendation:
          type: string
          enum: [flight, train, bus]
        recommendationReason:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/TransitOption"

    TransitOption:
      type: object
      required: [mode, label, durationMinutes, durationLabel, estimatedCost, costCurrency, source, isEstimated, convenience, summary]
      properties:
        mode:
          type: string
          enum: [flight, train, bus]
        label:
          type: string
        durationMinutes:
          type: number
        durationLabel:
          type: string
        estimatedCost:
          type: number
        costCurrency:
          type: string
          enum: [EUR]
        departureTime:
          type: ["string", "null"]
        arrivalTime:
          type: ["string", "null"]
        source:
          type: string
        isEstimated:
          type: boolean
        convenience:
          type: string
          enum: [high, medium, low]
        summary:
          type: string
